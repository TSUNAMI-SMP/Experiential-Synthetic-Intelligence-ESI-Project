[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "esi"
version = "0.2.0"
description = "ESI-01: Experiential Synthetic Intelligence research runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.4", "scipy==1.18.1", "pydantic==2.14.1", "PyYAML==6.0.3",
  "httpx==0.28.1", "soundfile==0.14.0", "sounddevice==0.5.6",
  "faster-whisper==1.2.1", "onnxruntime==1.31.0",
]

[project.optional-dependencies]
gui = ["PySide6==6.12.0"]
dev = ["pytest==9.1.1", "ruff==0.17.0"]
live2d = ["live2d-py==1.0.0", "PyOpenGL==3.1.10", "Pillow==12.3.0"]

[project.scripts]
esi = "esi.cli:main"
esi-desktop = "esi.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esi = ["resources/*.png", "resources/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires actual local LLM/TTS/ASR models"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
