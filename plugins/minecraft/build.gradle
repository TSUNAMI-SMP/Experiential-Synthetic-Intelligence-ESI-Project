plugins { id 'fabric-loom' version '1.14.10'; id 'maven-publish' }
version = project.mod_version
group = 'org.esi'
base { archivesName = 'esi-minecraft-bridge' }
repositories { maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "maven.modrinth:carpet:${project.carpet_version}"
}
fabricApi { configureTests { createSourceSet = true; modId = 'esi_bridge_test'; enableGameTests = true; enableClientGameTests = false; eula = false } }
processResources {
    from('THIRD-PARTY-NOTICES.txt')
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
